<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل Galaxy Ultra OS</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0D47A1, #1565C0, #000000);
            color: white;
            text-align: center;
            padding: 50px 20px;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .app-icon {
            width: 120px;
            height: 120px;
            border-radius: 25px;
            margin-bottom: 20px;
            border: 3px solid #00E5FF;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .version {
            font-size: 18px;
            color: #00E5FF;
            margin-bottom: 30px;
        }
        .download-btn {
            display: inline-block;
            background: #00E5FF;
            color: #000;
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            margin: 10px;
            transition: all 0.3s;
        }
        .download-btn:hover {
            background: #00B8D4;
            transform: scale(1.05);
        }
        .features {
            text-align: right;
            margin-top: 40px;
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
        }
        .features li {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="icon.png" alt="Galaxy Ultra OS" class="app-icon">
        <h1>Galaxy Ultra OS</h1>
        <p class="version">الإصدار 1.0.2</p>
        
        <a href="https://github.com/bdeerabed95/CleanerProUltra/releases/latest/download/app-debug.apk" class="download-btn">
            📥 تحميل التطبيق
        </a>
        
        <div class="features">
            <h3>المميزات:</h3>
            <ul>
                <li>✨ واجهة Galaxy Ultra العصرية</li>
                <li>🚀 تحسين الأداء والسرعة</li>
                <li>🔋 إدارة البطارية</li>
                <li>🧹 تنظيف التخزين</li>
                <li>🤖 مساعد ذكي</li>
            </ul>
        </div>
    </div>
</body>
</html>
